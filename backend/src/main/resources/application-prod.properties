spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.frontend-origin=${FRONTEND_ORIGIN}
app.auth.username=${APP_AUTH_USERNAME}
app.auth.password=${APP_AUTH_PASSWORD}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.jwt-expiration-minutes=${APP_AUTH_JWT_EXPIRATION_MINUTES:60}
